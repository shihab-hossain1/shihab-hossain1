<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290">
  <style>
    .m{font-family:'JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace}
    .flow{stroke-dasharray:6 8;animation:f 1s linear infinite}@keyframes f{to{stroke-dashoffset:-14}}
    .pk{animation:pk 2.5s linear infinite}@keyframes pk{0%{opacity:0}10%{opacity:1}90%{opacity:1}100%{opacity:0}}
    .live{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
  </style>
  <rect x="1" y="1" width="1198" height="288" rx="14" fill="#060a0e" stroke="#1d3b33" stroke-width="2"/>
  <circle cx="26" cy="26" r="4" fill="#00ff9c" class="live"/>
  <text x="38" y="30" class="m" fill="#e6edf3" font-size="12" font-weight="700">MACHINE LEARNING &amp; FULL-STACK PIPELINE</text>
  <text x="1176" y="30" class="m" fill="#00ff9c" font-size="11" text-anchor="end">[ DATA → MODEL → PRODUCT ]</text>

  <g class="m" font-size="11">
    <!-- arrows -->
    <g stroke="#00ff9c" stroke-width="2" fill="none" class="flow">
      <path d="M234 150 H252"/><path d="M464 150 H482"/><path d="M694 150 H712"/><path d="M924 150 H942"/>
    </g>
    <g fill="#00ff9c"><path d="M252 145 l8 5 l-8 5z"/><path d="M482 145 l8 5 l-8 5z"/><path d="M712 145 l8 5 l-8 5z"/><path d="M942 145 l8 5 l-8 5z"/></g>

    <!-- stage template -->
    <g transform="translate(32 64)">
      <rect width="200" height="176" rx="10" fill="#0a1410" stroke="#00ff9c" stroke-opacity=".6"/>
      <text x="14" y="22" fill="#5b6b7a" font-size="9">STAGE 01</text>
      <text x="14" y="44" fill="#e6edf3" font-size="14" font-weight="700">DATA SOURCES</text>
      <text x="14" y="72" fill="#c9d1d9">CSV / Web data</text><text x="14" y="92" fill="#c9d1d9">MySQL tables</text><text x="14" y="112" fill="#c9d1d9">IoT sensors</text>
      <rect x="14" y="138" width="172" height="24" rx="5" fill="#0f2a20"/><text x="100" y="154" fill="#00ff9c" text-anchor="middle">INGEST &amp; STORE</text>
    </g>
    <g transform="translate(262 64)">
      <rect width="200" height="176" rx="10" fill="#0a1218" stroke="#22d3ee" stroke-opacity=".6"/>
      <text x="14" y="22" fill="#5b6b7a" font-size="9">STAGE 02</text>
      <text x="14" y="44" fill="#e6edf3" font-size="14" font-weight="700">PREPROCESS</text>
      <text x="14" y="72" fill="#c9d1d9">Pandas · NumPy</text><text x="14" y="92" fill="#c9d1d9">Cleaning · EDA</text><text x="14" y="112" fill="#c9d1d9">Feature eng.</text>
      <rect x="14" y="138" width="172" height="24" rx="5" fill="#0c2230"/><text x="100" y="154" fill="#22d3ee" text-anchor="middle">CLEAN DATASET</text>
    </g>
    <g transform="translate(492 64)">
      <rect width="200" height="176" rx="10" fill="#0a1410" stroke="#00ff9c" stroke-opacity=".6"/>
      <text x="14" y="22" fill="#5b6b7a" font-size="9">STAGE 03</text>
      <text x="14" y="44" fill="#e6edf3" font-size="14" font-weight="700">MODEL</text>
      <text x="14" y="72" fill="#c9d1d9">scikit-learn</text><text x="14" y="92" fill="#c9d1d9">NLP · Vision</text><text x="14" y="112" fill="#c9d1d9">Training loop</text>
      <rect x="14" y="138" width="172" height="24" rx="5" fill="#0f2a20"/><text x="100" y="154" fill="#00ff9c" text-anchor="middle">FIT &amp; TUNE</text>
    </g>
    <g transform="translate(722 64)">
      <rect width="200" height="176" rx="10" fill="#0a1218" stroke="#22d3ee" stroke-opacity=".6"/>
      <text x="14" y="22" fill="#5b6b7a" font-size="9">STAGE 04</text>
      <text x="14" y="44" fill="#e6edf3" font-size="14" font-weight="700">EVALUATE</text>
      <text x="14" y="72" fill="#c9d1d9">Cross-validation</text><text x="14" y="92" fill="#c9d1d9">Metrics · plots</text><text x="14" y="112" fill="#c9d1d9">Error analysis</text>
      <rect x="14" y="138" width="172" height="24" rx="5" fill="#0c2230"/><text x="100" y="154" fill="#22d3ee" text-anchor="middle">VALIDATED MODEL</text>
    </g>
    <g transform="translate(952 64)">
      <rect width="208" height="176" rx="10" fill="#0a1410" stroke="#00ff9c" stroke-opacity=".6"/>
      <text x="14" y="22" fill="#5b6b7a" font-size="9">STAGE 05</text>
      <text x="14" y="44" fill="#e6edf3" font-size="14" font-weight="700">SHIP</text>
      <text x="14" y="72" fill="#c9d1d9">Django app / API</text><text x="14" y="92" fill="#c9d1d9">MySQL backend</text><text x="14" y="112" fill="#c9d1d9">Docker · Git</text>
      <rect x="14" y="138" width="180" height="24" rx="5" fill="#0f2a20"/><text x="104" y="154" fill="#00ff9c" text-anchor="middle" class="live">● LIVE PRODUCT</text>
    </g>
  </g>
  <text x="600" y="272" class="m" fill="#5b6b7a" font-size="10" text-anchor="middle">How I approach a project — from raw data to a working application</text>
</svg>
