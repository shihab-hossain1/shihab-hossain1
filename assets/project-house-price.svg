<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1a14"/><stop offset="1" stop-color="#05080c"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00ff9c" stop-opacity=".35"/><stop offset="1" stop-color="#00ff9c" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .m{font-family:'JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace}.s{font-family:'Segoe UI',Ubuntu,Arial,sans-serif}
    .draw{stroke-dasharray:900;stroke-dashoffset:900;animation:d 3s ease-out forwards infinite alternate}
    @keyframes d{to{stroke-dashoffset:0}}
    .bar{transform-box:fill-box;transform-origin:bottom;animation:grow 2.4s ease-in-out infinite alternate}
    @keyframes grow{from{transform:scaleY(.4)}to{transform:scaleY(1)}}
  </style>
  <rect width="600" height="340" rx="14" fill="url(#bg)" stroke="#1f6f5c"/>
  <!-- laptop-like dashboard -->
  <rect x="40" y="34" width="520" height="250" rx="10" fill="#0a0f14" stroke="#24453a"/>
  <text x="60" y="62" class="s" fill="#e6edf3" font-size="16" font-weight="700">BD House Price Predictor</text>
  <text x="60" y="80" class="m" fill="#5b6b7a" font-size="10">ML MODEL · REGRESSION · APARTMENT PRICES</text>
  <g class="m" font-size="10">
    <rect x="360" y="50" width="56" height="20" rx="10" fill="#0f2a20" stroke="#00ff9c" stroke-opacity=".6"/><text x="388" y="64" fill="#00ff9c" text-anchor="middle">Dhaka</text>
    <rect x="422" y="50" width="70" height="20" rx="10" fill="#0d151b" stroke="#24453a"/><text x="457" y="64" fill="#8b98a5" text-anchor="middle">Chattogram</text>
    <rect x="498" y="50" width="50" height="20" rx="10" fill="#0d151b" stroke="#24453a"/><text x="523" y="64" fill="#8b98a5" text-anchor="middle">Sylhet</text>
  </g>
  <!-- chart -->
  <g stroke="#14231d"><line x1="60" y1="120" x2="380" y2="120"/><line x1="60" y1="160" x2="380" y2="160"/><line x1="60" y1="200" x2="380" y2="200"/><line x1="60" y1="240" x2="380" y2="240"/></g>
  <path d="M60 230 L100 214 L140 220 L180 190 L220 196 L260 160 L300 168 L340 132 L380 118 L380 240 L60 240Z" fill="url(#area)"/>
  <path class="draw" d="M60 230 L100 214 L140 220 L180 190 L220 196 L260 160 L300 168 L340 132 L380 118" fill="none" stroke="#00ff9c" stroke-width="2.5"/>
  <path d="M260 160 L300 150 L340 122 L380 104" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="380" cy="104" r="5" fill="#22d3ee"/>
  <text x="60" y="262" class="m" fill="#5b6b7a" font-size="9">— actual   - - predicted</text>
  <!-- side panel -->
  <rect x="400" y="96" width="140" height="170" rx="8" fill="#0d151b" stroke="#1b2a33"/>
  <text x="412" y="116" class="m" fill="#5b6b7a" font-size="9">FEATURES</text>
  <g class="m" font-size="10" fill="#c9d1d9">
    <text x="412" y="136">area_sqft</text><text x="412" y="154">bedrooms</text><text x="412" y="172">location</text><text x="412" y="190">floor_level</text>
  </g>
  <g fill="#00ff9c"><rect class="bar" x="490" y="128" width="40" height="8" rx="2"/><rect class="bar" x="490" y="146" width="30" height="8" rx="2" fill="#22d3ee"/><rect class="bar" x="490" y="164" width="36" height="8" rx="2"/><rect class="bar" x="490" y="182" width="18" height="8" rx="2" fill="#22d3ee"/></g>
  <rect x="412" y="210" width="116" height="42" rx="6" fill="#0f2a20"/>
  <text x="470" y="226" class="m" fill="#5b6b7a" font-size="8.5" text-anchor="middle">ESTIMATED PRICE</text>
  <text x="470" y="244" class="s" fill="#00ff9c" font-size="14" font-weight="700" text-anchor="middle">৳ predict()</text>
  <text x="300" y="316" class="m" fill="#5b6b7a" font-size="10" text-anchor="middle">Python · Pandas · scikit-learn</text>
</svg>
