<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1624"/><stop offset="1" stop-color="#05080c"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .m{font-family:'JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace}.s{font-family:'Segoe UI',Ubuntu,Arial,sans-serif}
    .ecg{stroke-dasharray:420;stroke-dashoffset:420;animation:e 2.2s linear infinite}
    @keyframes e{to{stroke-dashoffset:0}}
    .pl{animation:p 2s ease-in-out infinite}@keyframes p{50%{opacity:.4}}
  </style>
  <rect width="600" height="340" rx="14" fill="url(#bg)" stroke="#1f5a6f"/>
  <ellipse cx="300" cy="170" rx="260" ry="150" fill="url(#glow)"/>
  <!-- phone 1 -->
  <g transform="translate(120 26)">
    <rect width="160" height="280" rx="22" fill="#05080c" stroke="#2a3f4f" stroke-width="2"/>
    <rect x="8" y="10" width="144" height="260" rx="16" fill="#0b131c"/>
    <rect x="58" y="16" width="44" height="6" rx="3" fill="#1b2a33"/>
    <text x="20" y="44" class="s" fill="#e6edf3" font-size="13" font-weight="700">DiagnoCare</text>
    <text x="20" y="58" class="m" fill="#5b6b7a" font-size="8">Book a diagnostic test</text>
    <g class="s" font-size="10">
      <rect x="18" y="70" width="124" height="34" rx="8" fill="#0f2230" stroke="#22d3ee" stroke-opacity=".5"/><text x="28" y="85" fill="#e6edf3">Complete Blood Count</text><text x="28" y="98" fill="#22d3ee" font-size="8">Today · 10:30 AM</text>
      <rect x="18" y="110" width="124" height="34" rx="8" fill="#0d1820"/><text x="28" y="125" fill="#c9d1d9">Lipid Profile</text><text x="28" y="138" fill="#5b6b7a" font-size="8">Tomorrow · 9:00 AM</text>
      <rect x="18" y="150" width="124" height="34" rx="8" fill="#0d1820"/><text x="28" y="165" fill="#c9d1d9">Chest X-Ray</text><text x="28" y="178" fill="#5b6b7a" font-size="8">Fri · 4:15 PM</text>
    </g>
    <rect x="18" y="226" width="124" height="30" rx="15" fill="#22d3ee"/>
    <text x="80" y="245" class="s" fill="#05080c" font-size="11" font-weight="700" text-anchor="middle">Book Test</text>
  </g>
  <!-- phone 2 -->
  <g transform="translate(320 26)">
    <rect width="160" height="280" rx="22" fill="#05080c" stroke="#2a3f4f" stroke-width="2"/>
    <rect x="8" y="10" width="144" height="260" rx="16" fill="#0b131c"/>
    <rect x="58" y="16" width="44" height="6" rx="3" fill="#1b2a33"/>
    <text x="20" y="44" class="s" fill="#e6edf3" font-size="13" font-weight="700">My Reports</text>
    <rect x="18" y="56" width="124" height="70" rx="8" fill="#0d1820"/>
    <path class="ecg" d="M24 96 H50 L58 76 L66 112 L74 92 H92 L98 84 L104 96 H136" fill="none" stroke="#00ff9c" stroke-width="2"/>
    <g class="s" font-size="10">
      <text x="20" y="148" fill="#c9d1d9">CBC Report</text><rect x="96" y="138" width="46" height="14" rx="7" fill="#0f2a20"/><text x="119" y="148" fill="#00ff9c" font-size="8" text-anchor="middle">READY</text>
      <text x="20" y="172" fill="#c9d1d9">Lipid Profile</text><rect x="96" y="162" width="46" height="14" rx="7" fill="#2a2410"/><text x="119" y="172" fill="#ffd866" font-size="8" text-anchor="middle" class="pl">PENDING</text>
      <text x="20" y="196" fill="#c9d1d9">X-Ray</text><rect x="96" y="186" width="46" height="14" rx="7" fill="#1b2a33"/><text x="119" y="196" fill="#8b98a5" font-size="8" text-anchor="middle">BOOKED</text>
    </g>
    <rect x="18" y="226" width="124" height="30" rx="15" fill="none" stroke="#22d3ee"/>
    <text x="80" y="245" class="s" fill="#22d3ee" font-size="11" font-weight="700" text-anchor="middle">Download PDF</text>
  </g>
</svg>
