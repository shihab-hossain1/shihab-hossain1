  <circle cx="1078" cy="72" r="4" fill="#00ff9c" class="live"/>
  <text x="1150" y="76" class="m g" font-size="11" text-anchor="end">VERIFIED</text>
  <line x1="490" y1="92" x2="1170" y2="92" stroke="#12251f"/>

  <g class="m" font-size="13">
