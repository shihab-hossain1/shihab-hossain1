<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#00ff9c" stroke-opacity="0.04"/>
    </pattern>
    <radialGradient id="glow" cx="25%" cy="55%" r="45%">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0.13"/><stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="strap" x1="0" x2="1">
      <stop offset="0" stop-color="#0e7490"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ff9c"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1a17"/><stop offset="1" stop-color="#070b10"/>
    </linearGradient>
    <radialGradient id="emblem" cx=".4" cy=".35" r=".75">
      <stop offset="0" stop-color="#b9ffe0"/><stop offset=".45" stop-color="#22e39b"/><stop offset="1" stop-color="#0a5a3e"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".13"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ringg" x1="0" x2="1">
      <stop offset="0" stop-color="#00ff9c"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="card"><rect x="185" y="100" width="230" height="330" rx="18"/></clipPath>
    <clipPath id="panel"><rect x="490" y="50" width="680" height="360" rx="14"/></clipPath>
  </defs>
  <style>
    .m{font-family:'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace}
    .s{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .dim{fill:#5b6b7a}.w{fill:#e6edf3}.g{fill:#00ff9c}.c{fill:#22d3ee}.p{fill:#c792ea}
    .swing{transform-origin:300px 0px;animation:swing 4s ease-in-out infinite alternate}
    @keyframes swing{from{transform:rotate(-2.6deg)}to{transform:rotate(2.6deg)}}
    .shine{animation:shine 5s ease-in-out infinite}
    @keyframes shine{0%,55%{transform:translateX(-260px)}100%{transform:translateX(320px)}}
    .ring{stroke-dasharray:439.82;animation:ring 8s ease-in-out infinite}
    @keyframes ring{0%{stroke-dashoffset:439.82}30%,90%{stroke-dashoffset:13.2}100%{stroke-dashoffset:439.82}}
    .spin{transform-origin:1010px 215px;animation:spin 12s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .live{animation:blink 1.6s ease-in-out infinite}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:.15}}
    .scan{animation:scan 4s linear infinite}
    @keyframes scan{from{transform:translateY(0)}to{transform:translateY(358px)}}
    .row{opacity:0;animation:show .4s ease-out forwards}
    @keyframes show{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  </style>

  <rect x="1" y="1" width="1198" height="458" rx="16" fill="#070b10" stroke="#1d3b33" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="458" rx="16" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="458" rx="16" fill="url(#glow)"/>

  <!-- ============ LANYARD + BADGE ============ -->
