    <path d="M282 0 L290 78 L310 78 L318 0 Z" fill="url(#strap)"/>
    <g class="m" font-size="7" fill="#062a33" font-weight="700">
      <text x="300" y="22" text-anchor="middle">QA</text><text x="300" y="48" text-anchor="middle">QA</text>
    </g>
    <rect x="286" y="74" width="28" height="16" rx="4" fill="#1f2a33" stroke="#5b6b7a"/>
    <rect x="294" y="88" width="12" height="20" rx="3" fill="#8b98a5"/>

    <rect x="183" y="98" width="234" height="334" rx="20" fill="url(#edge)" opacity=".85"/>
