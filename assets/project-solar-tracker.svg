<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1408"/><stop offset="1" stop-color="#05080c"/></linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#ffb020"/><stop offset="1" stop-color="#ffb020" stop-opacity="0"/></radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#0b1a40"/></linearGradient>
  </defs>
  <style>
    .m{font-family:'JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace}.s{font-family:'Segoe UI',Ubuntu,Arial,sans-serif}
    .sunmove{offset-path:path('M120 230 Q 300 -20 480 230');animation:arc 8s ease-in-out infinite alternate}
    @keyframes arc{from{offset-distance:0%}to{offset-distance:100%}}
    .tilt{transform-origin:300px 250px;animation:tilt 8s ease-in-out infinite alternate}
    @keyframes tilt{from{transform:rotate(-38deg)}to{transform:rotate(38deg)}}
    .led{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:.2}}
  </style>
  <rect width="600" height="340" rx="14" fill="url(#sky)" stroke="#6f5a1f"/>
  <path d="M120 230 Q 300 -20 480 230" fill="none" stroke="#ffb020" stroke-opacity=".25" stroke-dasharray="4 6"/>
  <g class="sunmove"><circle r="34" fill="url(#sun)"/><circle r="14" fill="#fff3b0"/></g>
  <!-- tracker -->
  <rect x="294" y="250" width="12" height="44" fill="#3a3f47"/>
  <rect x="250" y="292" width="100" height="10" rx="3" fill="#2a2f36"/>
  <g class="tilt">
    <rect x="220" y="236" width="160" height="16" rx="3" fill="url(#panel)" stroke="#7aa2ff" stroke-opacity=".6"/>
    <g stroke="#7aa2ff" stroke-opacity=".35"><line x1="260" y1="236" x2="260" y2="252"/><line x1="300" y1="236" x2="300" y2="252"/><line x1="340" y1="236" x2="340" y2="252"/></g>
    <circle cx="226" cy="230" r="4" fill="#ff5f57"/><circle cx="374" cy="230" r="4" fill="#ff5f57"/>
  </g>
  <circle cx="300" cy="250" r="6" fill="#8b949e"/>
  <!-- arduino readout -->
  <g transform="translate(30 30)">
    <rect width="150" height="96" rx="8" fill="#0a1a1c" stroke="#00979d"/>
    <text x="12" y="20" class="m" fill="#00979d" font-size="10" font-weight="700">ARDUINO UNO</text>
    <circle cx="136" cy="16" r="4" fill="#00ff9c" class="led"/>
    <text x="12" y="42" class="m" fill="#c9d1d9" font-size="10">LDR_L  : 612</text>
    <text x="12" y="58" class="m" fill="#c9d1d9" font-size="10">LDR_R  : 598</text>
    <text x="12" y="74" class="m" fill="#ffd866" font-size="10">SERVO  : tracking</text>
    <text x="12" y="88" class="m" fill="#5b6b7a" font-size="9">Δ → rotate to balance</text>
  </g>
  <g transform="translate(420 30)">
    <rect width="150" height="64" rx="8" fill="#0d1117" stroke="#3a3f47"/>
    <text x="12" y="22" class="m" fill="#5b6b7a" font-size="9">PANEL ALIGNMENT</text>
    <text x="12" y="48" class="s" fill="#ffb020" font-size="18" font-weight="800">Follows sun</text>
  </g>
  <text x="300" y="324" class="m" fill="#5b6b7a" font-size="10" text-anchor="middle">Arduino · C++ · LDR sensors · Servo motor</text>
</svg>
